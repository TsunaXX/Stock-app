[runner]
# app.py is a large explicit Streamlit application and does not use bare
# expression "magic". Disabling the AST rewrite removes several seconds from
# every cold script compilation without changing any rendered element.
magicEnabled = false

[server]
# Render deploys immutable images, so watching /app for source changes only
# consumes inotify handles and can trigger noisy rerun errors.
fileWatcherType = "none"
runOnSave = false
