name: Python CI Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    # 測試多個 Python 版本，確保相容性
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: 檢出原始碼
      uses: actions/checkout@v4

    - name: 設定 Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip' # 自動快取 pip 套件，加速後續執行

    - name: 安裝相依套件
      run: |
        python -m pip install --upgrade pip
        # 安裝檢查與測試工具
        pip install ruff pytest 
        # 如果專案有 requirements.txt 則安裝，沒有就跳過
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: 執行阻斷性程式碼檢查 (Ruff)
      run: |
        # 停止建構：如果程式碼有語法錯誤或未定義的變數
        ruff check . --select=E9,F63,F7,F82

    - name: 執行單元測試 (Pytest)
      run: |
        # 專案目前未提供測試檔時，至少驗證主程式可編譯；有測試時才執行 pytest。
        python -m py_compile app.py
        if find . -path './.git' -prune -o \( -name 'test_*.py' -o -name '*_test.py' \) -print -quit | grep -q .; then
          pytest
        else
          echo '尚無 pytest 測試檔，已完成 app.py 編譯檢查。'
        fi
