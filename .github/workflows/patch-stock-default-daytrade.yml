name: Patch stock strategy default to daytrade

on:
  push:
    branches:
      - codex/stock-default-daytrade-20260910
    paths:
      - .github/workflows/patch-stock-default-daytrade.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/stock-default-daytrade-20260910
          fetch-depth: 0

      - name: Change stock strategy fallback to daytrade
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app.py')
          text = path.read_text(encoding='utf-8')

          old_fallback = "'risk_filter_strategy_mode', '隔日／波段',"
          new_fallback = "'risk_filter_strategy_mode', '當沖',"
          old_comment = '並在尚未建立過模式 widget 時採波段預設，避免未定義變數。'
          new_comment = '並在尚未建立過模式 widget 時採當沖預設，避免未定義變數。'

          if text.count(old_fallback) != 1:
              raise SystemExit(f'Expected exactly one stock strategy fallback, found {text.count(old_fallback)}')
          if text.count(old_comment) != 1:
              raise SystemExit(f'Expected exactly one fallback comment, found {text.count(old_comment)}')

          text = text.replace(old_fallback, new_fallback, 1)
          text = text.replace(old_comment, new_comment, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify Python syntax
        run: python -m py_compile app.py

      - name: Commit app patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git diff --cached --check
          git diff --cached --exit-code && exit 1 || true
          git commit -m "Default stock strategy room to daytrade"
          git push origin HEAD:codex/stock-default-daytrade-20260910
