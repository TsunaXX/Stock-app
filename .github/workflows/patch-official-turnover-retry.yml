name: Patch official turnover retries

on:
  push:
    branches:
      - codex/official-turnover-retry-20260910
    paths:
      - .github/workflows/patch-official-turnover-retry.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/official-turnover-retry-20260910
          fetch-depth: 0

      - name: Add official turnover API retries
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app.py')
          text = path.read_text(encoding='utf-8')

          old = '''    def get_json(url, params=None):
              if str(url).startswith(_TPEX_ORIGIN):
                  with _tpex_verified_session() as session:
                      response = session.get(
                          url, params=params, headers=headers, timeout=(3, 8),
                      )
              else:
                  response = requests.get(
                      url, params=params, headers=headers, timeout=(3, 8),
                  )
              response.raise_for_status()
              return response.json()
          '''

          new = '''    def get_json(url, params=None, attempts=3):
              \"\"\"Retry transient official API failures before surfacing an error.\"\"\"
              last_error = None
              for attempt in range(attempts):
                  try:
                      if str(url).startswith(_TPEX_ORIGIN):
                          with _tpex_verified_session() as session:
                              response = session.get(
                                  url, params=params, headers=headers, timeout=(3, 8),
                              )
                              response.raise_for_status()
                              return response.json()

                      response = requests.get(
                          url, params=params, headers=headers, timeout=(3, 8),
                      )
                      response.raise_for_status()
                      return response.json()
                  except (requests.RequestException, ValueError) as exc:
                      last_error = exc
                      if attempt + 1 < attempts:
                          time.sleep(0.5 * (attempt + 1))

              if isinstance(last_error, requests.RequestException):
                  raise requests.ConnectionError(
                      f\"官方資料連線失敗（已自動重試 {attempts} 次）：{last_error}\"
                  ) from last_error
              raise ValueError(
                  f\"官方資料回應格式異常（已自動重試 {attempts} 次）：{last_error}\"
              ) from last_error
          '''

          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one official turnover get_json block, found {text.count(old)}')

          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Verify Python syntax
        run: python -m py_compile app.py

      - name: Commit app patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git diff --cached --check
          git diff --cached --exit-code && exit 1 || true
          git commit -m "Retry official turnover API requests"
          git push origin HEAD:codex/official-turnover-retry-20260910
