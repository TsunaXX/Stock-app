name: Mirror Stock-app to XTsunaX

on:
  push:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: stock-app-backup-mirror
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mirror:
    if: github.repository == 'TsunaXX/Stock-app'
    runs-on: ubuntu-latest
    env:
      BACKUP_REPO_TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
      SOURCE_REPO: TsunaXX/Stock-app
      BACKUP_REPO: XTsunaX/Stock-app

    steps:
      - name: Check backup token
        id: token
        shell: bash
        run: |
          if [ -z "$BACKUP_REPO_TOKEN" ]; then
            echo "::warning::BACKUP_REPO_TOKEN is not configured. Mirror sync skipped."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Compare source and backup refs
        id: compare
        if: steps.token.outputs.ready == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          source_refs="$(mktemp)"
          backup_refs="$(mktemp)"

          git ls-remote --heads --tags             "https://x-access-token:${GH_TOKEN}@github.com/${SOURCE_REPO}.git"             | sort > "$source_refs"

          git ls-remote --heads --tags             "https://x-access-token:${BACKUP_REPO_TOKEN}@github.com/${BACKUP_REPO}.git"             | sort > "$backup_refs"

          if cmp -s "$source_refs" "$backup_refs"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Source and backup refs are already identical."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Repository refs differ; mirror sync is required."
          fi

      - name: Mirror repository
        if: steps.token.outputs.ready == 'true' && steps.compare.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git clone --mirror             "https://x-access-token:${GH_TOKEN}@github.com/${SOURCE_REPO}.git"             source.git

          cd source.git

          git push --mirror             "https://x-access-token:${BACKUP_REPO_TOKEN}@github.com/${BACKUP_REPO}.git"

      - name: Summary
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.token.outputs.ready }}" != "true" ]; then
            echo "Mirror skipped: BACKUP_REPO_TOKEN is not configured." >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.compare.outputs.changed }}" = "true" ]; then
            echo "Mirror sync completed or was attempted." >> "$GITHUB_STEP_SUMMARY"
            echo "Source: ${SOURCE_REPO}" >> "$GITHUB_STEP_SUMMARY"
            echo "Backup: ${BACKUP_REPO}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No repository ref changes detected; no sync was needed." >> "$GITHUB_STEP_SUMMARY"
          fi
