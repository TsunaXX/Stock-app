name: Apply stock strategy price basis fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-stock-strategy-price-basis:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch stock strategy price basis
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app.py')
          source = path.read_text(encoding='utf-8')

          old_base = "    strategy_base_price = hist_strat.iloc[-1]['Close']\n"
          new_base = "    # 戰略備註與表格收盤價使用同一價格基準；歷史 K 棒仍保留原值供高低點與均線計算。\n    strategy_base_price = (\n        live_quote_price\n        if live_quote_price is not None and live_quote_price > 0\n        else live_base_price\n    )\n"
          if source.count(old_base) != 1:
              raise SystemExit(f'strategy base target count={source.count(old_base)}; aborting')
          source = source.replace(old_base, new_base, 1)

          old_display = "    display_price = live_quote_price if live_quote_price is not None and live_quote_price > 0 else live_base_price\n"
          new_display = "    display_price = strategy_base_price\n"
          if source.count(old_display) != 1:
              raise SystemExit(f'display price target count={source.count(old_display)}; aborting')
          source = source.replace(old_display, new_display, 1)

          path.write_text(source, encoding='utf-8')
          PY

      - name: Validate patch
        shell: bash
        run: |
          python -m py_compile app.py
          python - <<'PY'
          from pathlib import Path
          source = Path('app.py').read_text(encoding='utf-8')
          assert "strategy_base_price = (\n        live_quote_price\n        if live_quote_price is not None and live_quote_price > 0\n        else live_base_price\n    )" in source
          assert "display_price = strategy_base_price" in source
          assert "strategy_base_price = hist_strat.iloc[-1]['Close']" not in source
          PY

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/fix_stock_strategy_price_basis.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py .github/workflows/fix_stock_strategy_price_basis.yml
          git commit -m "Align stock strategy notes with analyzed price"
          git push origin HEAD:main
