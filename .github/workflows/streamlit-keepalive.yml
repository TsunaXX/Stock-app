name: Streamlit Private App Access Check

on:
  # Community Cloud requires an authenticated viewer for private apps. An
  # anonymous scheduled request cannot keep this app awake, so this workflow is
  # intentionally manual and only diagnoses the public access boundary.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: streamlit-private-app-access-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Check Streamlit access boundary
        env:
          STREAMLIT_HEALTH_URL: https://stock-app-qjzbqsoqs4hylyypaddep4.streamlit.app/_stcore/health
        run: |
          status="$(curl --silent --show-error \
            --connect-timeout 10 --max-time 20 \
            --dump-header /tmp/streamlit-headers.txt \
            --output /tmp/streamlit-health.txt --write-out '%{http_code}' \
            "$STREAMLIT_HEALTH_URL")"

          if [ "$status" = "200" ] && grep --quiet --line-regexp 'ok' /tmp/streamlit-health.txt; then
            echo "Streamlit health endpoint is publicly reachable and healthy."
            exit 0
          fi

          if [ "$status" = "303" ] && grep --fixed-strings --ignore-case --quiet \
            'location: https://share.streamlit.io/-/auth/app?' \
            /tmp/streamlit-headers.txt; then
            echo "::notice::This is a private Streamlit app. Its authentication boundary is reachable, but anonymous GitHub Actions requests cannot inspect or keep the app process awake."
            exit 0
          fi

          cat /tmp/streamlit-headers.txt
          cat /tmp/streamlit-health.txt
          echo "::error::Unexpected Streamlit response (HTTP $status)."
          exit 1
