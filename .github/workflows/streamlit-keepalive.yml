name: Streamlit Keepalive

on:
  schedule:
    # Community Cloud hibernates apps after 12 hours without traffic.
    # Visit the app every 4 hours to leave a wide safety margin.
    - cron: "17 */4 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/streamlit-keepalive.yml"

permissions:
  contents: read

concurrency:
  group: streamlit-keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install Selenium
        run: python -m pip install --disable-pip-version-check --quiet "selenium>=4.26,<5"

      - name: Visit Streamlit app with a real browser session
        env:
          STREAMLIT_APP_URL: https://stock-app-qjzbqsoqs4hylyypaddep4.streamlit.app/
        run: |
          python - <<'PY'
          import os
          import shutil
          import time
          from urllib.parse import urlparse

          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC

          app_url = os.environ["STREAMLIT_APP_URL"]
          expected_host = urlparse(app_url).hostname

          chrome = shutil.which("google-chrome") or shutil.which("google-chrome-stable")
          if not chrome:
              raise SystemExit("Google Chrome is not available on this GitHub runner.")

          options = Options()
          options.binary_location = chrome
          options.add_argument("--headless=new")
          options.add_argument("--no-sandbox")
          options.add_argument("--disable-dev-shm-usage")
          options.add_argument("--disable-gpu")
          options.add_argument("--window-size=1280,900")
          options.add_argument("--lang=en-US")

          driver = webdriver.Chrome(options=options)
          driver.set_page_load_timeout(60)

          try:
              # Community Cloud may establish even public anonymous sessions through
              # JavaScript + cookies, so use a real browser instead of curl.
              driver.get(app_url)
              time.sleep(12)

              # Self-heal if a scheduled run was missed and the app has already slept.
              body_text = driver.find_element(By.TAG_NAME, "body").text.lower()
              if "gone to sleep" in body_text or "get this app back up" in body_text:
                  wake_button = None
                  for button in driver.find_elements(By.TAG_NAME, "button"):
                      if "get this app back up" in button.text.lower():
                          wake_button = button
                          break
                  if wake_button is None:
                      raise SystemExit("Streamlit app is sleeping but the wake button was not found.")
                  wake_button.click()
                  time.sleep(20)
                  driver.get(app_url)
                  time.sleep(10)

              current = urlparse(driver.current_url)
              if current.hostname != expected_host or current.path.startswith("/-/login"):
                  raise SystemExit(
                      f"Browser did not finish an anonymous public Streamlit session: {driver.current_url}"
                  )

              # Verify that the actual Streamlit application UI rendered. Navigating the
              # browser directly to /_stcore/health can return the Community Cloud shell
              # instead of plain 'ok', so it is not a reliable browser-session check.
              WebDriverWait(driver, 45).until(
                  EC.presence_of_element_located((By.CSS_SELECTOR, '[data-testid="stAppViewContainer"]'))
              )

              final_body = driver.find_element(By.TAG_NAME, "body").text.lower()
              if "gone to sleep" in final_body or "get this app back up" in final_body:
                  raise SystemExit("Streamlit app returned to the sleep screen after loading.")

              print(
                  "Streamlit keepalive succeeded: anonymous browser session established "
                  "and the Streamlit app UI rendered."
              )
          finally:
              driver.quit()
          PY
