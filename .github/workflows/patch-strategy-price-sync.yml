name: Apply strategy note price sync fix

on:
  push:
    branches:
      - fix/strategy-note-price-sync

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/strategy-note-price-sync
      - name: Patch and validate
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
          python -m py_compile app.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/patch-strategy-price-sync.yml
          git add app.py .github/workflows/patch-strategy-price-sync.yml
          git commit -m "fix: sync strategy notes with refreshed stock prices"
          git push origin HEAD:fix/strategy-note-price-sync
